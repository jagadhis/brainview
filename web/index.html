<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%236d5dfc'/><circle cx='11' cy='13' r='3' fill='white'/><circle cx='21' cy='12' r='2.4' fill='white'/><circle cx='17' cy='21' r='2.8' fill='white'/></svg>" />
    <title>brainview</title>
    <script>
      try {
        const t = localStorage.getItem("brainview:theme");
        const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
