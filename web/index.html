<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%236d5dfc'/><circle cx='11' cy='13' r='3' fill='white'/><circle cx='21' cy='12' r='2.4' fill='white'/><circle cx='17' cy='21' r='2.8' fill='white'/></svg>" />
    <title>brainview</title>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("brainview:preferences") || "{}") || {};
        const mode = p.mode || localStorage.getItem("brainview:theme") || "system";
        const dark = mode === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : mode === "dark";
        document.documentElement.classList.toggle("dark", dark);
        if (typeof p.tone === "string") document.documentElement.dataset.tone = p.tone;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
